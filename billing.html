<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Billing · The OG Coffee</title><style>
:root{--tan:#c6ae8e;--cream:#f5ede1;--ink:#241a12;--brown:#6b4a2f;--ease:cubic-bezier(.22,1,.36,1)}
*{box-sizing:border-box}
body{margin:0;background:var(--cream);color:var(--ink);font-family:Inter,-apple-system,"Helvetica Neue",Arial,sans-serif;line-height:1.55;padding-bottom:84px}
a{color:inherit}
header{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;padding:20px clamp(20px,5vw,64px)}
header b{font-family:Georgia,serif;font-size:1.3rem}
nav{display:flex;flex-wrap:wrap;align-items:center;gap:6px 18px}
nav a{text-decoration:none;font-size:.92rem;margin:0}
nav a.on{font-weight:600}
.btn{display:inline-block;border:0;cursor:pointer;font:inherit;font-weight:500;background:var(--ink);color:var(--cream);padding:12px 24px;border-radius:999px;text-decoration:none;transition:transform .3s var(--ease)}
.btn:hover{transform:translateY(-2px)}
.btn:disabled{opacity:.4;cursor:not-allowed;transform:none}
nav .btn{padding:9px 18px}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--ink)}
.add{margin-top:12px;padding:9px 20px}
.qty{display:inline-flex;align-items:center;gap:12px;margin-top:12px}
.qty button{width:32px;height:32px;border-radius:50%;border:1.5px solid var(--ink);background:transparent;font-size:1.1rem;cursor:pointer;color:var(--ink)}
.page{padding:0 clamp(20px,5vw,64px) 40px;max-width:1100px;margin:0 auto}
.page h1,.sec h2{font-family:Georgia,serif;margin:8px 0 4px}
.sub{color:rgba(36,26,18,.7);margin:0 0 24px}
.sec{padding:clamp(32px,5vw,56px) clamp(20px,5vw,64px) 0}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:20px;margin-top:16px}
.card{background:#fff8ee;border-radius:18px;padding:24px}
.card h3{font-family:Georgia,serif;margin:0 0 6px}
.card span{color:var(--brown);font-weight:600}
.card p{margin:6px 0 0}
.card small{display:block;color:var(--brown);font-weight:600;margin-bottom:6px}
.more{padding:0 clamp(20px,5vw,64px);text-align:center}
.pays{font-size:.85rem;color:rgba(36,26,18,.6);margin-top:10px}
.cols{display:grid;grid-template-columns:1.4fr 1fr;gap:28px;align-items:start}
.panel{background:#fff8ee;border-radius:18px;padding:24px}
.row{display:grid;grid-template-columns:1fr auto 80px;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid rgba(36,26,18,.1)}
.row small{display:block;color:rgba(36,26,18,.6)}
.row>span:last-child{text-align:right;font-weight:600}
.tot{display:flex;justify-content:space-between;padding:6px 0}
.tot.big{font-weight:700;font-size:1.25rem;border-top:1.5px solid var(--ink);margin-top:8px;padding-top:12px}
label{display:block;margin:10px 0 4px;font-size:.9rem;font-weight:500}
input[type=text],input[type=tel],textarea,select{width:100%;padding:11px 14px;border-radius:12px;border:1.5px solid rgba(36,26,18,.25);background:#fff;font:inherit}
.opt{display:flex;gap:10px;align-items:center;padding:12px 14px;border:1.5px solid rgba(36,26,18,.2);border-radius:12px;margin-top:8px;cursor:pointer}
.opt input{accent-color:var(--ink)}
.stars{color:#b8791f;letter-spacing:2px}
table{width:100%;border-collapse:collapse;background:#fff8ee;border-radius:14px;overflow:hidden}
th,td{padding:12px 14px;text-align:left;border-bottom:1px solid rgba(36,26,18,.08);font-size:.92rem}
th{background:var(--tan)}
.wrap{overflow-x:auto}
.stat{font-size:1.9rem;font-family:Georgia,serif}
.bars{display:flex;align-items:flex-end;gap:12px;height:200px;margin-top:16px}
.bars div{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;font-size:.78rem;text-align:center}
.bars i{display:block;width:100%;background:var(--brown);border-radius:8px 8px 0 0;min-height:2px}
.ok{background:#e6f1e0;border-radius:18px;padding:28px;text-align:center}
.note{font-size:.82rem;color:rgba(36,26,18,.6);margin-top:12px}
footer{padding:32px clamp(20px,5vw,64px);color:rgba(36,26,18,.6);font-size:.9rem}
footer a{margin-right:14px}
#minibar{position:fixed;left:50%;transform:translateX(-50%);bottom:max(16px,env(safe-area-inset-bottom));width:min(560px,calc(100% - 24px));background:var(--ink);color:var(--cream);border-radius:999px;padding:10px 12px 10px 24px;display:none;align-items:center;justify-content:space-between;gap:12px;z-index:50;box-shadow:0 10px 30px rgba(0,0,0,.25)}
#minibar .btn{background:var(--tan);color:var(--ink);padding:9px 20px}
#minibar .pay{font-size:.78rem;opacity:.7}
@media (max-width:767px){.cols{grid-template-columns:1fr}.hide-sm,#minibar .pay{display:none}.row{grid-template-columns:1fr auto 64px}}
</style></head>
<body><header><b><a href="index.html" style="text-decoration:none">The OG Coffee</a></b><nav><a href="menu.html">Menu</a><a href="index.html#best">Bestsellers</a><a href="reviews.html">Reviews</a><a href="orders.html">Orders</a><a href="admin.html">Sales</a><a class="btn" href="billing.html">Cart (<span id="cc">0</span>)</a></nav></header>
<main class="page"><h1>Your order</h1><p class="sub">Review your cart, pick a payment option and place your order.</p>
<div id="done" class="ok" hidden></div>
<div class="cols" id="main"><div class="panel"><div id="lines"></div></div>
<form class="panel" id="co"><h3 style="margin-top:0;font-family:Georgia,serif">Bill</h3>
<div class="tot"><span>Subtotal</span><span id="sub"></span></div><div class="tot"><span>GST (5%)</span><span id="gst"></span></div><div class="tot big"><span>Total</span><span id="tot"></span></div>
<label for="nm">Name</label><input type="text" id="nm" name="name" required autocomplete="name">
<label for="ph">Phone</label><input type="tel" id="ph" name="phone" required autocomplete="tel" pattern="[0-9+ ]{8,15}">
<label>Payment option</label>
<label class="opt"><input type="radio" name="pay" value="UPI" checked> UPI (GPay, PhonePe, Paytm)</label>
<label class="opt"><input type="radio" name="pay" value="Card"> Credit / Debit card</label>
<label class="opt"><input type="radio" name="pay" value="Cash"> Cash at the counter</label>
<button class="btn" id="go" style="width:100%;margin-top:16px">Place order</button>
<p class="note">Demo checkout: no real payment is taken yet.</p></form></div></main><div id="f"></div>
<script>
/* The OG Coffee shop logic. Data lives in this browser's localStorage (no server). */
const MENU=[
{id:'espresso',n:'Espresso',p:150,d:'Short, strong, golden crema.'},
{id:'americano',n:'Americano',p:170,d:'Espresso stretched with hot water.'},
{id:'cappuccino',n:'Cappuccino',p:210,d:'Espresso, steamed milk, deep foam.'},
{id:'flat-white',n:'Flat White',p:220,d:'Double ristretto, silky milk.'},
{id:'cafe-latte',n:'Café Latte',p:230,d:'Espresso in warm, light-foam milk.'},
{id:'mocha',n:'Mocha',p:260,d:'Espresso, dark chocolate, whipped cream.'},
{id:'cold-brew',n:'Cold Brew',p:260,d:'Steeped for eighteen hours.'},
{id:'iced-latte',n:'Iced Latte',p:250,d:'Espresso over cold milk and ice.'},
{id:'caramel-macchiato',n:'Caramel Macchiato',p:280,d:'Vanilla milk, espresso, caramel.'},
{id:'affogato',n:'Affogato',p:290,d:'Vanilla ice cream, hot espresso.'},
{id:'oak-latte',n:'Oak Latte',p:280,d:'House caramel and toasted oat.'}];
const GST=0.05;
const $=(s,r=document)=>r.querySelector(s);
const store={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const inr=n=>'₹'+Number(n).toLocaleString('en-IN');
const item=id=>MENU.find(m=>m.id===id);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const stars=n=>'★'.repeat(n)+'☆'.repeat(5-n);

const Cart={
  get:()=>store.get('og_cart',{}),
  set(c){store.set('og_cart',c);drawBar()},
  add(id,n=1){const c=this.get();c[id]=Math.max(0,(c[id]||0)+n);if(!c[id])delete c[id];this.set(c)},
  count(){return Object.values(this.get()).reduce((a,b)=>a+b,0)},
  bill(){let sub=0;const lines=Object.entries(this.get()).filter(([id])=>item(id)).map(([id,q])=>{const m=item(id);sub+=m.p*q;return{...m,q,amt:m.p*q}});
    const gst=Math.round(sub*GST);return{lines,sub,gst,total:sub+gst}}
};

/* ---- sample sales history so Sales / Bestsellers are not empty on day one ---- */
function seed(){
  if(store.get('og_orders',null))return;
  let r=7;const rnd=()=>(r=(r*9301+49297)%233280)/233280,now=new Date(),o=[];
  for(let m=5;m>=0;m--){const n=14+Math.floor(rnd()*10)+(5-m)*2;
    for(let i=0;i<n;i++){let d=new Date(now.getFullYear(),now.getMonth()-m,1+Math.floor(rnd()*27),9+Math.floor(rnd()*10));if(d>now)d=new Date(now-36e5);
      const items={};let sub=0;
      for(let j=0,k=1+Math.floor(rnd()*3);j<k;j++){const it=MENU[Math.floor(Math.pow(rnd(),1.6)*MENU.length)];items[it.id]=(items[it.id]||0)+1;sub+=it.p}
      const gst=Math.round(sub*GST);
      o.push({id:'OG'+(1000+o.length),date:d.toISOString(),items,sub,gst,total:sub+gst,pay:['UPI','Card','Cash'][Math.floor(rnd()*3)],name:'Sample customer',status:'Delivered',demo:true})}}
  store.set('og_orders',o);
}
function sales(){
  const o=store.get('og_orders',[]),mo={},q={};
  o.forEach(x=>{const d=new Date(x.date),k=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');mo[k]=(mo[k]||0)+x.total;for(const id in x.items)q[id]=(q[id]||0)+x.items[id]});
  return{o,mo,q};
}
function topItems(n=3){const{q}=sales();return Object.entries(q).filter(([id])=>item(id)).sort((a,b)=>b[1]-a[1]).slice(0,n).map(([id,c])=>({...item(id),c}))}
function months(n=6){const now=new Date(),out=[];for(let i=n-1;i>=0;i--){const d=new Date(now.getFullYear(),now.getMonth()-i,1);out.push({k:d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0'),l:d.toLocaleString('en',{month:'short'})})}return out}

/* ---- reviews ---- */
const REV0=[{n:'Aarav',s:5,t:'The flat white is silky and strong. Loved picking my coffee from the book shelf!',d:'2026-09-12'},
{n:'Meera',s:5,t:'Cold brew was smooth and not bitter at all. Quick service too.',d:'2026-09-20'},
{n:'Rohan',s:4,t:'Great caramel macchiato, a little sweet for me but lovely atmosphere.',d:'2026-09-27'}];
const reviews=()=>store.get('og_reviews',REV0);
function revHTML(n){return reviews().slice(-n).reverse().map(r=>`<div class="card"><div class="stars">${stars(r.s)}</div><p>${esc(r.t)}</p><small style="margin-top:10px">${esc(r.n)} · ${esc(r.d)}</small></div>`).join('')}

/* ---- UI helpers ---- */
const R=[];function mount(f){R.push(f);f()}function refresh(){R.forEach(f=>f());drawBar()}
function hdr(active){
  const l=[['menu.html','Menu'],['index.html#best','Bestsellers'],['reviews.html','Reviews'],['orders.html','Orders'],['admin.html','Sales']];
  $('header').innerHTML=`<b><a href="index.html" style="text-decoration:none">The OG Coffee</a></b><nav>${l.map(([h,t])=>`<a class="${t==='Sales'?'hide-sm ':''}${t===active?'on':''}" href="${h}">${t}</a>`).join('')}<a class="btn" href="billing.html">Cart (<span id="cc">0</span>)</a></nav>`;
  drawBar();
}
function drawBar(){
  const n=Cart.count(),cc=$('#cc');if(cc)cc.textContent=n;
  let b=$('#minibar');if(!b){b=document.createElement('div');b.id='minibar';document.body.appendChild(b)}
  if(!n||/billing\.html$/.test(location.pathname)){b.style.display='none';return}
  b.style.display='flex';b.innerHTML=`<span>${n} item${n>1?'s':''} · ${inr(Cart.bill().total)}</span><span class="pay">UPI · Card · Cash</span><a class="btn" href="billing.html">Checkout</a>`;
}
function card(m,tag){const q=Cart.get()[m.id]||0;
  return `<div class="card">${tag?`<small>${tag}</small>`:''}<h3>${m.n}</h3><span>${inr(m.p)}</span><p>${m.d}</p>${q?`<div class="qty"><button data-dec="${m.id}" aria-label="Remove one">−</button><b>${q}</b><button data-add="${m.id}" aria-label="Add one">+</button></div>`:`<button class="btn add" data-add="${m.id}">Add to cart</button>`}</div>`}
function bestHTML(){const t=topItems(3);return t.length?t.map((m,i)=>card(m,`#${i+1} bestseller · ${m.c} sold`)).join(''):''}
function footer(){return `<footer><a href="menu.html">Menu</a><a href="reviews.html">Reviews</a><a href="orders.html">Orders</a><a href="admin.html">Sales</a><br>© The OG Coffee</footer>`}
document.addEventListener('click',e=>{
  const a=e.target.closest('[data-add]'),d=e.target.closest('[data-dec]');
  if(a)Cart.add(a.dataset.add,1);if(d)Cart.add(d.dataset.dec,-1);if(a||d)refresh();
});
seed();
</script>
<script>hdr('');
mount(()=>{const b=Cart.bill();
 $('#lines').innerHTML=b.lines.length?b.lines.map(l=>`<div class="row"><span>${l.n}<small>${inr(l.p)} each</small></span><span class="qty" style="margin:0"><button data-dec="${l.id}" aria-label="Remove one">−</button><b>${l.q}</b><button data-add="${l.id}" aria-label="Add one">+</button></span><span>${inr(l.amt)}</span></div>`).join(''):'<p>Your cart is empty. <a href="menu.html">Browse the menu</a></p>';
 $('#sub').textContent=inr(b.sub);$('#gst').textContent=inr(b.gst);$('#tot').textContent=inr(b.total);$('#go').disabled=!b.lines.length});
$('#co').addEventListener('submit',e=>{e.preventDefault();const b=Cart.bill();if(!b.lines.length)return;
 const f=new FormData(e.target),items={};b.lines.forEach(l=>items[l.id]=l.q);
 const o={id:'OG'+Date.now().toString().slice(-6),date:new Date().toISOString(),items,sub:b.sub,gst:b.gst,total:b.total,pay:f.get('pay'),name:f.get('name'),phone:f.get('phone'),status:'Preparing'};
 store.set('og_orders',[...store.get('og_orders',[]),o]);store.set('og_cart',{});drawBar();
 $('#main').hidden=true;const d=$('#done');d.hidden=false;
 d.innerHTML=`<h2 style="font-family:Georgia,serif;margin:0 0 8px">Thank you, ${esc(o.name)}!</h2><p>Order <b>${o.id}</b> is being prepared. Total ${inr(o.total)} · ${esc(o.pay)}.</p><a class="btn" href="orders.html">View my orders</a> <a class="btn ghost" href="menu.html">Order more</a>`});
$('#f').outerHTML=footer();</script>
</body></html>
